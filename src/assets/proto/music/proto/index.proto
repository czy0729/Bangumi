syntax = "proto3";

// 找音乐搜索数据 (finger)
//  - 与 src/utils/thirdParty/protobuf/schemas.ts 的 music schema 同步维护
//  - proto3 默认值 (0 / '' / 空数组) 编码后缺席, 未筛选 / 无标签 等语义依赖这一点
//  - 音乐无 subject 类型细分 / 无话数 / 不收想听数, 故无 t / e / c 字段

message Music {
  /** 条目 Id */
  int32 i = 1;
  /** 发行日期 */
  string d = 2;
  /** 评分 */
  float s = 3;
  /** 排名 */
  int32 r = 4;
  /** 评分人数 */
  int32 l = 5;
  /** 标签下标数组 (见 MUSIC_TAGS, 收录标签 top100) */
  repeated int32 t = 6;
  /** 敏感标记 (1 = NSFW, 0/缺席 = 全年龄) */
  int32 x = 7;
}

/** 条目列表包装 */
message Payload {
  repeated Music payload = 1;
}
